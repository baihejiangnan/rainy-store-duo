<!doctype html>
<html lang="zh-CN">
<head>

<meta name="theme-color" content="#111c29"><meta name="description" content="同一份提示词，两份雨夜便利店微缩三维场景。分别进入 DSH 与 Codex 的原始作品。">
<title>雨夜便利店 · 两种演绎</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#e8e7dc;background:#111c29}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;padding:70px 40px 36px;margin:auto}header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:42px}.eyebrow{font:500 11px/1.6 ui-monospace,monospace;letter-spacing:.22em;color:#88b5ab;margin:0 0 16px}h1{font:500 clamp(29px,4vw,48px)/1.25 "Yu Mincho","Songti SC",serif;letter-spacing:.06em;margin:0}header p{font-size:13px;line-height:1.9;color:#a7b0b9;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}a.card{display:block;color:inherit;text-decoration:none;border-top:1px solid #43505a}.image{overflow:hidden;background:#0a1422;aspect-ratio:1.44}img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}a.card:hover img{transform:scale(1.025)}.caption{display:flex;align-items:center;justify-content:space-between;padding:22px 0 18px;border-bottom:1px solid #33424e}.number{font:11px ui-monospace,monospace;color:#91aaa7;margin-right:13px}h2{font-size:18px;letter-spacing:.03em;font-weight:500;margin:0;display:inline}.enter{font-size:12px;color:#b6c9c0}.arrow{font-size:18px;margin-left:11px}footer{margin-top:36px;padding-top:18px;border-top:1px solid #33424e;display:flex;justify-content:space-between;gap:20px;color:#8e9ba7;font-size:11px;line-height:1.8}footer a{color:#b3bfbf;text-underline-offset:4px}a:focus-visible{outline:2px solid #bdcfb8;outline-offset:5px}@media(max-width:720px){main{padding:40px 22px 26px}header{display:block;margin-bottom:30px}header p{margin-top:18px}.grid{grid-template-columns:1fr;gap:30px}footer{display:block}footer p{margin:6px 0}}@media(prefers-reduced-motion:reduce){img{transition:none}}
</style>
</head>
<body><main>
<header><div><p class="eyebrow">RAINY NIGHT / TWO INTERPRETATIONS</p><h1>雨夜便利店</h1></div><p>同一份提示词，两种演绎。<br>进入场景，旋转、缩放，看看雨中的街角。</p></header>
<div class="grid">
<a class="card" href="./dsh/"><div class="image"><img src="./assets/dsh.jpg" alt="DSH 制作的雨夜便利店三维场景" width="1440" height="1000"></div><div class="caption"><div><span class="number">01</span><h2>DSH 版本</h2></div><span class="enter">进入场景<span class="arrow" aria-hidden="true">↗</span></span></div></a>
<a class="card" href="./codex/"><div class="image"><img src="./assets/codex.jpg" alt="Codex 制作的雨夜便利店三维场景" width="1440" height="1000"></div><div class="caption"><div><span class="number">02</span><h2>Codex 版本</h2></div><span class="enter">进入场景<span class="arrow" aria-hidden="true">↗</span></span></div></a>
